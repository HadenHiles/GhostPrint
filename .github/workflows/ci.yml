name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Assert zero network egress in the shipped bundle
        run: npm run check:egress

      - name: Assert MVP hardening policy
        run: npm run check:hardening

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: xvfb-run -a npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/
