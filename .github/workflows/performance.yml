name: Performance benchmark

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Run required top-50 benchmark
        run: xvfb-run -a npm run bench:required

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: |
            bench-results.json
            bench-results.md
